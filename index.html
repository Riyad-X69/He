<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Magical Surprise Show</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000; /* ফুল ব্ল্যাক ব্যাকগ্রাউন্ড */
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            z-index: 1;
        }

        /* প্রথমবার ক্লিক করার জন্য মাঝখানের লাল ইমোজি */
        #center-heart {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            font-size: 50px;
            cursor: pointer;
            animation: heartBeat 1.2s infinite alternate;
            user-select: none;
        }

        @keyframes heartBeat {
            0% { transform: translate(-50%, -50%) scale(1); filter: drop-shadow(0 0 5px red); }
            100% { transform: translate(-50%, -50%) scale(1.25); filter: drop-shadow(0 0 25px red); }
        }

        /* টাচ বা ক্লিকের স্থানে ম্যাজিকাল টেক্সট ও ইমোজি প্রদর্শনের স্টাইল */
        .magic-popup {
            position: absolute;
            font-weight: bold;
            pointer-events: none;
            white-space: nowrap;
            animation: popAnimation 2.2s ease-out forwards;
            z-index: 5;
            text-align: center;
        }

        @keyframes popAnimation {
            0% {
                transform: scale(0.3) translateY(20px) rotate(0deg);
                opacity: 0;
            }
            30% {
                transform: scale(1.3) translateY(0px) rotate(-3deg);
                opacity: 1;
            }
            100% {
                transform: scale(1.6) translateY(-70px) rotate(5deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- শুরুর লাল ইমোজি (মিউজিক অন করার জন্য) -->
    <div id="center-heart">❤️</div>

    <!-- ব্যাকগ্রাউন্ড অডিও -->
    <audio id="bgMusic" src="lv_0_20260911152631.mp4" loop></audio>

    <canvas id="magicCanvas"></canvas>

    <script>
        const canvas = document.getElementById('magicCanvas');
        const ctx = canvas.getContext('2d');
        const centerHeart = document.getElementById('center-heart');
        const bgMusic = document.getElementById('bgMusic');

        let particles = [];
        let hue = 0;
        let isStarted = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // আলোর কণা বা স্পার্ক ক্লাস
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 6 + 1;
                this.speedX = (Math.random() - 0.5) * 10;
                this.speedY = (Math.random() - 0.5) * 10;
                this.color = color;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.01;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.size *= 0.94;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // স্ক্রিনের যেকোনো স্থানে ক্লিক করা জায়গায় ম্যাজিক এফেক্ট ও লেখা দেখানোর ফাংশন
        function showMagicEffect(x, y, customText = null) {
            const el = document.createElement('div');
            el.className = 'magic-popup';

            // ফানি টেক্সট ও ইমোজির কালেকশন
            const texts = [
                "𝕾𝖚𝖗𝖕𝖗𝖎𝖘𝖊! 𝕸𝖆𝖉𝖊𝖗 𝕱𝖚𝖈𝖐𝖊𝖗 𝖑𝖆𝖆 🌚",
                "🔥 LOL 🤣",
                "✨ 𝕾𝖚𝖗𝖕𝖗𝖎𝖘𝖊 𝕸𝖆𝖉𝖊𝖗 𝕱𝖚𝖈𝖐𝖊𝖗 𝖑𝖆𝖆 🗿",
                "🤣 𝖄𝖔𝖔𝖔! 🔥",
                "💀 𝕷𝖆𝖆 𝖑𝖆𝖆 🌚",
                "🎉 𝕾𝖚𝖗𝖕𝖗𝖎𝖘𝖊! 🚀"
            ];

            el.innerHTML = customText || texts[Math.floor(Math.random() * texts.length)];

            const randomColor = `hsl(${Math.random() * 360}, 100%, 65%)`;
            const randomSize = Math.floor(Math.random() * 6) + 18;

            el.style.left = (x - 130) + 'px';
            el.style.top = (y - 30) + 'px';
            el.style.fontSize = randomSize + 'px';
            el.style.color = randomColor;
            el.style.textShadow = `0 0 15px ${randomColor}, 0 0 30px ${randomColor}, 0 0 45px #ffffff`;

            document.body.appendChild(el);

            setTimeout(() => {
                el.remove();
            }, 2200);
        }

        // ১. প্রথমে লাল ইমোজি ক্লিক করলে মিউজিক অন হবে এবং হার্টটি হাইড হয়ে যাবে
        centerHeart.addEventListener('click', (e) => {
            e.stopPropagation(); // যাতে ব্যাকগ্রাউন্ডেও ক্লিক ট্রিগার না হয়
            if (!isStarted) {
                isStarted = true;
                centerHeart.style.display = 'none';
                bgMusic.play().catch(err => console.log(err));

                // যে স্থানে ক্লিক করা হয়েছে সেখানে প্রথম লেখাটি ভেসে উঠবে
                showMagicEffect(e.clientX, e.clientY, "𝕾𝖚𝖗𝖕𝖗𝖎𝖘𝖊! 𝕸𝖆𝑴𝖊𝖗 𝕱𝖚𝈈𝖐𝖊𝖗 𝖑𝖆𝖆 🌚");
                
                const mainColor = `hsl(${hue}, 100%, 60%)`;
                for (let i = 0; i < 25; i++) {
                    particles.push(new Particle(e.clientX, e.clientY, mainColor));
                }
            }
        });

        // ২. একবার মিউজিক অন হওয়ার পর, স্ক্রিনের যেকোনো জায়গায় যতবার খুশি ক্লিক বা টাচ করলে ম্যাজিক আসবে
        window.addEventListener('mousedown', (e) => {
            if (!isStarted) return; // মিউজিক অন না হলে কাজ করবে না
            
            const clientX = e.clientX;
            const clientY = e.clientY;

            showMagicEffect(clientX, clientY);

            const mainColor = `hsl(${hue}, 100%, 60%)`;
            for (let i = 0; i < 20; i++) {
                particles.push(new Particle(clientX, clientY, mainColor));
            }

            hue = (hue + 45) % 360;
        });

        window.addEventListener('touchstart', (e) => {
            if (!isStarted) return;
            
            const clientX = e.touches[0].clientX;
            const clientY = e.touches[0].clientY;

            showMagicEffect(clientX, clientY);

            const mainColor = `hsl(${hue}, 100%, 60%)`;
            for (let i = 0; i < 20; i++) {
                particles.push(new Particle(clientX, clientY, mainColor));
            }

            hue = (hue + 45) % 360;
        }, { passive: true });

        // অ্যানিমেশন লুপ
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
